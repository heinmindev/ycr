# YCR continuous integration (plan step 13, spec S26).
#
# Third-party actions are pinned by commit SHA, never by tag: a tag is mutable, so `@v4` means
# "whatever that account pushes there next", which is a supply-chain hole in a pipeline that
# holds database credentials and can write to the repository.
#
# Permissions are read-only at the workflow level and granted per job only where more is needed.
#
# No password is stored as a secret or written to a file. Every credential is generated per run
# and lives only in that run's environment, so there is nothing to leak between runs and nothing
# for a fork to exfiltrate.

name: CI

on:
  push:
    branches: [main, 'feature/**']
    # Ledger and progress commits change no code and cannot break a build, so they do not
    # deserve a full container-backed run. `main` receives a steady stream of them — one per
    # task claim, status change and checkpoint — and on `main` a run also carries the
    # trunk-only job, which pulls a second multi-gigabyte image.
    #
    # This applies to every pushed branch, not only `main`: GitHub allows one `push` key, and
    # the same reasoning holds on a feature branch. A commit that touches code as well as these
    # paths still runs, because `paths-ignore` skips only when *every* changed file matches.
    paths-ignore:
      - 'TASKS.md'
      - 'docs/progress/**'
      # F-006A-2: the standalone-task progress files live under docs/progress/**, but a feature's
      # progress file lives beside its spec and plan, so the pattern above never matched the file
      # that generates the most checkpoint commits.
      - 'docs/features/**/progress.md'
  pull_request:
    branches: [main]
    # Deliberately NO paths-ignore here. A skipped workflow does not report a neutral result —
    # it reports nothing at all. A pull request whose commits touch only the ignored paths would
    # therefore get no CI result, and once any of these jobs is a required status check that
    # pull request sits blocked forever on a check that will never arrive. Wasting one cheap run
    # on a ledger-only pull request is the better trade.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a run is right on a branch, where only the newest commit matters. It is wrong on
  # `main`: every commit there is a candidate for release, and a cancelled run leaves that commit
  # with no evidence it ever passed. So `main` runs always finish, even when pushes arrive close
  # together.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YCR_DESIGN_TIME_CONNECTION: Server=localhost;Database=YcrDesignTime;Trusted_Connection=True;TrustServerCertificate=True

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore YCR.sln

      - name: Build
        run: dotnet build YCR.sln --no-restore --configuration Debug

      # R-4. Check constraints and every other mapped detail live in the EF model, so the model
      # and the migrations must agree. This fails the build when someone changes a configuration
      # without adding a migration — including dropping a UTC check constraint, which nothing
      # else would notice.
      - name: Verify the model matches the migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/YCR.Infrastructure
          --startup-project src/YCR.Infrastructure

      # Built once, then handed to every test process through YCR_MIGRATION_BUNDLE. Each process
      # would otherwise build its own, and `dotnet ef migrations bundle` publishes through the
      # Infrastructure project's obj/ directory, so parallel builds collide.
      - name: Build the migration bundle once
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          dotnet ef migrations bundle --force \
            --project src/YCR.Infrastructure \
            --startup-project src/YCR.Infrastructure \
            --output "$RUNNER_TEMP/bundle/efbundle"
          echo "YCR_MIGRATION_BUNDLE=$RUNNER_TEMP/bundle/efbundle" >> "$GITHUB_ENV"

      - name: Test
        run: >
          dotnet test YCR.sln --no-build
          --
          --report-xunit-trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-build-and-test
          path: ${{ runner.temp }}/test-results
          retention-days: 7
          if-no-files-found: warn

      # Testcontainers cleans up after itself, so on a failure the container is usually already
      # gone. Whatever survives is captured, because a SQL Server that refused to start is
      # otherwise invisible in the test output.
      - name: Upload container logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/container-logs"
          for id in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$id" | tr -d '/')
            docker logs "$id" > "$RUNNER_TEMP/container-logs/$name.log" 2>&1 || true
          done
          docker ps -a > "$RUNNER_TEMP/container-logs/docker-ps.txt" 2>&1 || true

      - name: Upload container logs artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-logs-build-and-test
          path: ${{ runner.temp }}/container-logs
          retention-days: 7
          if-no-files-found: warn

  api-smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YCR_DESIGN_TIME_CONNECTION: Server=localhost;Database=YcrDesignTime;Trusted_Connection=True;TrustServerCertificate=True

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Generated per run, never stored. These exist only inside this job's environment.
      #
      # S-007A-2: each value is registered with ::add-mask:: in the same step that generates it,
      # before it can reach any later command's output. A mask applies to everything the runner
      # logs from that point on, so a tool that echoes its connection string — which is how these
      # would otherwise escape — prints *** instead. Masking after first use would be too late.
      - name: Generate credentials
        run: |
          sa_password="Sa1!$(openssl rand -hex 16)"
          app_password="Ap1!$(openssl rand -hex 16)"
          migrator_password="Mg1!$(openssl rand -hex 16)"

          echo "::add-mask::$sa_password"
          echo "::add-mask::$app_password"
          echo "::add-mask::$migrator_password"

          # F-002: an ephemeral ES256 (P-256) signing key for this run only (ADR-0023 item 7; R14).
          # Its kid starts neither dev- nor test-, and it is not DevelopmentOnly, because the API
          # runs as Production and refuses such keys (S26a). Every base64 line is masked before the
          # key goes anywhere; the PEM header and footer are not secret.
          signing_key="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256)"
          while IFS= read -r line; do
            case "$line" in -----*) ;; *) echo "::add-mask::$line" ;; esac
          done <<< "$signing_key"

          # The first administrator's passwords for the bootstrap journey below (D10, R26).
          admin_initial_password="In1!$(openssl rand -hex 16)"
          admin_password="Ad1!$(openssl rand -hex 16)"
          echo "::add-mask::$admin_initial_password"
          echo "::add-mask::$admin_password"

          {
            echo "MSSQL_SA_PASSWORD=$sa_password"
            echo "YCR_APP_PASSWORD=$app_password"
            echo "YCR_MIGRATOR_PASSWORD=$migrator_password"
            echo "YCR_SMOKE_ADMIN_INITIAL_PASSWORD=$admin_initial_password"
            echo "YCR_SMOKE_ADMIN_PASSWORD=$admin_password"
            echo "YCR_SMOKE_SIGNING_KEY<<YCR_SMOKE_SIGNING_KEY_EOF"
            echo "$signing_key"
            echo "YCR_SMOKE_SIGNING_KEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Start the database
        run: docker compose up -d

      - name: Build
        run: |
          dotnet tool restore
          dotnet restore YCR.sln
          dotnet build src/YCR.Api/YCR.Api.csproj --no-restore --configuration Release
          dotnet build src/YCR.Worker/YCR.Worker.csproj --no-restore --configuration Release

      # Applied under the migrator credential, then the app user is joined to the role the
      # migration created. The API itself never has DDL rights (spec E7, S22).
      - name: Apply migrations and finish provisioning
        run: |
          dotnet ef migrations bundle --force \
            --project src/YCR.Infrastructure \
            --startup-project src/YCR.Infrastructure \
            --output "$RUNNER_TEMP/efbundle"
          # S-007A-2: the migrator password goes to the bundle in the environment, not on its
          # command line. The bundle takes its connection from the design-time factory when
          # --connection is absent, so a step-scoped override targets the real database without
          # the password ever appearing in a process argument list. The job-level value stays the
          # inert placeholder that the bundle *build* above uses.
          YCR_DESIGN_TIME_CONNECTION="Server=localhost,1433;Database=YCR;User Id=ycr_migrator;Password=${YCR_MIGRATOR_PASSWORD};TrustServerCertificate=True;Current Language=us_english" \
            "$RUNNER_TEMP/efbundle"
          docker compose up -d sqlserver-init
          sleep 10
          docker logs ycr-sqlserver-init

      # Against the built API and a real database — not the test host. In F-001 every API test
      # registered the test authentication handler, so the suite was structurally blind to the
      # shape that actually ships; that is how an unauthenticated request returning 500 instead of
      # 401 reached step 11 undetected. F-002's real-token and Unmodified-host tests narrow that
      # gap, and this job still checks the built artifacts as a deployment runs them.
      #
      # ASPNETCORE_ENVIRONMENT is deliberately NOT Development: the OpenAPI document must not be
      # served outside it, and that is asserted below.
      #
      # F-002: the deployed shape needs a signing key and an allowed origin, or startup refuses
      # (S26a, R9). Both come from the environment, as they would from a deployment's secret
      # store; the key never touches the disk.
      #
      # F-004 plan Amendment 2 (hein, 2026-09-25, T-046 G2): the API starts from its build output
      # directory, so that directory is its content root and the shipped appsettings.json is what
      # it reads — including Time:LocalTimeZone, which has deliberately NO environment override
      # here. Started from the repository root, no appsettings.json is read and the API refuses to
      # start ("Time:LocalTimeZone is not configured"), which fails this step.
      - name: Run the API
        working-directory: src/YCR.Api/bin/Release/net10.0
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Application: Server=localhost,1433;Database=YCR;User Id=ycr_app;Password=${{ env.YCR_APP_PASSWORD }};TrustServerCertificate=True;Current Language=us_english
          Auth__AllowedOrigins__0: https://ycr.smoke.invalid
          Auth__Signing__ActiveKeyId: ci-${{ github.run_id }}
          Auth__Signing__Keys__0__KeyId: ci-${{ github.run_id }}
          Auth__Signing__Keys__0__DevelopmentOnly: 'false'
          Auth__Signing__Keys__0__PrivateKeyPkcs8Pem: ${{ env.YCR_SMOKE_SIGNING_KEY }}
        run: |
          # The built assembly, run directly. `dotnet run` would background a launcher whose PID
          # is not the API's, leaving nothing reliable to stop afterwards.
          dotnet YCR.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/health/live > /dev/null 2>&1; then
              echo "API is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Smoke the API
        run: |
          set -euo pipefail
          fail=0

          check() {
            local name=$1 expected=$2 actual=$3
            if [ "$actual" = "$expected" ]; then
              echo "PASS  $name (got $actual)"
            else
              echo "FAIL  $name: expected $expected, got $actual"
              fail=1
            fi
          }

          check "/health/live is 200" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/health/live)"

          check "/health/ready is 200" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/health/ready)"

          # F-004 Amendment 2 (G2): the API is running, so it read a Time:LocalTimeZone it can
          # resolve (it refuses to start otherwise), and nothing in this job's environment sets
          # one — so it came from the shipped appsettings.json in the content root named here.
          check "the API's content root is its build output directory" "1" \
            "$(grep -cF "Content root path: $GITHUB_WORKSPACE/src/YCR.Api/bin/Release/net10.0" "$RUNNER_TEMP/api.log" || true)"
          check "the API process has no Time__ environment override" "0" \
            "$(tr '\0' '\n' < "/proc/$(cat "$RUNNER_TEMP/api.pid")/environ" | grep -cE '^(ASPNETCORE_|DOTNET_)?Time__' || true)"

          # The document maps every route and the permission each one requires. A deployed
          # instance has no reason to hand that out, so it is Development-only.
          check "/openapi/v1.json is not served outside Development" 404 \
            "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5080/openapi/v1.json)"

          api=http://127.0.0.1:5080
          origin=https://ycr.smoke.invalid
          headers="$RUNNER_TEMP/headers.txt"
          header() { grep -i "^$1:" "$headers" | head -1 | cut -d' ' -f2- | tr -d '\r'; }

          # F-002 (D14, S22): the framework bearer challenge, customised to ProblemDetails.
          body=$(curl -s -D "$headers" "$api/api/v1/stations")
          echo "401 body: $body"
          check "GET /api/v1/stations is 401" "HTTP/1.1 401 Unauthorized" "$(head -1 "$headers" | tr -d '\r')"
          # Not merely a 401: ProblemDetails with a stable errorCode, which is what a caller
          # actually branches on (docs/20 §4).
          check "401 carries errorCode Auth.Unauthenticated" "Auth.Unauthenticated" "$(echo "$body" | jq -r .errorCode)"
          check "401 carries a traceId" "true" "$(echo "$body" | jq 'has("traceId")')"
          check "401 carries WWW-Authenticate: Bearer" "Bearer" "$(header WWW-Authenticate)"

          # R24 / P10: security headers on the challenge and on an ordinary 200; no CORS (S26b, S26c).
          for path in /api/v1/stations /health/live; do
            curl -s -o /dev/null -D "$headers" "$api$path"
            check "$path X-Content-Type-Options" "nosniff" "$(header X-Content-Type-Options)"
            check "$path Content-Security-Policy" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" "$(header Content-Security-Policy)"
            check "$path Referrer-Policy" "no-referrer" "$(header Referrer-Policy)"
            check "$path X-Frame-Options" "DENY" "$(header X-Frame-Options)"
          done
          curl -s -o /dev/null -D "$headers" -X OPTIONS "$api/api/v1/auth/login" \
            -H "Origin: https://evil.invalid" -H "Access-Control-Request-Method: POST"
          check "preflight from a foreign origin has no CORS header" "0" "$(grep -ci '^access-control-' "$headers" || true)"

          login() {
            curl -s -D "$headers" -X POST "$api/api/v1/auth/login" -H "Content-Type: application/json" "$@"
          }

          # R9: login without Origin is refused before any credential is evaluated.
          body=$(login -d '{"userName":"smoke.admin","password":"irrelevant.value"}')
          check "login without Origin is Auth.OriginRejected" "Auth.OriginRejected" "$(echo "$body" | jq -r .errorCode)"

          # Through the identity schema and grants under ycr_app: an unknown user gets the uniform 401.
          body=$(login -H "Origin: $origin" -d '{"userName":"smoke.admin","password":"irrelevant.value"}')
          check "unknown user is Auth.InvalidCredentials" "Auth.InvalidCredentials" "$(echo "$body" | jq -r .errorCode)"

          # D10 / S25 in the deployed shape: bootstrap with the built Worker (password on stdin),
          # sign in, change the must-change password, sign in again, call a protected endpoint.
          # The bootstrap runs with DOTNET_ENVIRONMENT=Testing: in Production (the Worker's default)
          # it refuses a SystemAdministrator until MFA ships (ADR-0023 item 4 as amended; S-1,
          # T-030). The API itself still runs as Production.
          printf '%s\n' "$YCR_SMOKE_ADMIN_INITIAL_PASSWORD" | \
            DOTNET_ENVIRONMENT=Testing \
            ConnectionStrings__Application="Server=localhost,1433;Database=YCR;User Id=ycr_app;Password=${YCR_APP_PASSWORD};TrustServerCertificate=True;Current Language=us_english" \
            dotnet src/YCR.Worker/bin/Release/net10.0/YCR.Worker.dll bootstrap-administrator --username smoke.admin \
            && bootstrap=0 || bootstrap=$?
          check "bootstrap-administrator exits 0" "0" "$bootstrap"

          body=$(login -H "Origin: $origin" -d "{\"userName\":\"smoke.admin\",\"password\":\"$YCR_SMOKE_ADMIN_INITIAL_PASSWORD\"}")
          token=$(echo "$body" | jq -r .accessToken)
          echo "::add-mask::$token"
          check "login sets the hardened refresh cookie" "1" \
            "$(grep -ci '^set-cookie: ycr_refresh=.*path=/api/v1/auth/refresh.*secure.*samesite=strict.*httponly' "$headers" || true)"
          check "login responses are no-store" "no-store" "$(header Cache-Control)"
          body=$(curl -s -H "Authorization: Bearer $token" "$api/api/v1/stations")
          check "must-change session is Auth.PasswordChangeRequired" "Auth.PasswordChangeRequired" "$(echo "$body" | jq -r .errorCode)"
          check "POST /api/v1/auth/password is 204" 204 "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api/api/v1/auth/password" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"currentPassword\":\"$YCR_SMOKE_ADMIN_INITIAL_PASSWORD\",\"newPassword\":\"$YCR_SMOKE_ADMIN_PASSWORD\"}")"

          body=$(login -H "Origin: $origin" -d "{\"userName\":\"smoke.admin\",\"password\":\"$YCR_SMOKE_ADMIN_PASSWORD\"}")
          token=$(echo "$body" | jq -r .accessToken)
          echo "::add-mask::$token"
          check "GET /api/v1/stations with a real token is 200" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$api/api/v1/stations")"
          check "GET /api/v1/users with a real token is 200" 200 \
            "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "$api/api/v1/users")"

          # F-003: routes in the deployed shape, through the seeded routes.* grants
          # (Identity_SeedRoutePermissionGrants) and the Security_NetworkRouteGrants grants under
          # ycr_app, with the same administrator token.
          reply="$RUNNER_TEMP/reply.json"
          send() { curl -s -o "$reply" -w '%{http_code}' -H "Authorization: Bearer $token" "$@"; }
          body=$(curl -s "$api/api/v1/routes")
          check "anonymous GET /api/v1/routes is Auth.Unauthenticated" "Auth.Unauthenticated" "$(echo "$body" | jq -r .errorCode)"
          check "anonymous GET /api/v1/routes is 401" 401 "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/v1/routes")"
          check "POST /api/v1/stations SMA is 201" 201 "$(send -X POST "$api/api/v1/stations" -H "Content-Type: application/json" \
            -d '{"code":"SMA","nameEn":"Smoke A","nameMy":"ဘူတာ"}')"
          sma=$(jq -r .id "$reply")
          check "POST /api/v1/stations SMB is 201" 201 "$(send -X POST "$api/api/v1/stations" -H "Content-Type: application/json" \
            -d '{"code":"SMB","nameEn":"Smoke B","nameMy":"ဘူတာ"}')"
          smb=$(jq -r .id "$reply")
          check "POST /api/v1/routes is 201" 201 "$(send -X POST "$api/api/v1/routes" -H "Content-Type: application/json" \
            -d "{\"code\":\"SMOKE1\",\"nameEn\":\"Smoke route\",\"nameMy\":\"လမ်းကြောင်း\",\"isClosed\":false,\"stationIds\":[\"$sma\",\"$smb\"]}")"
          route=$(jq -r .id "$reply")
          check "GET /api/v1/routes/{id} is 200" 200 "$(send "$api/api/v1/routes/$route")"
          check "the route reads back with two stations" 2 "$(jq '.stations | length' "$reply")"
          check "GET /api/v1/routes is 200" 200 "$(send "$api/api/v1/routes")"
          check "POST /api/v1/routes/{id}/deactivate is 204" 204 "$(send -X POST "$api/api/v1/routes/$route/deactivate")"
          check "deactivating it again is 422" 422 "$(send -X POST "$api/api/v1/routes/$route/deactivate")"
          check "and says Network.RouteAlreadyInactive" "Network.RouteAlreadyInactive" "$(jq -r .errorCode "$reply")"

          # F-004: services in the deployed shape, through the seeded services.* grants
          # (Identity_SeedServicePermissionGrants), the Security_TimetableGrants grants, the Network
          # contract and the service-code lock under ycr_app, with the same administrator token.
          # Dates are Asia/Yangon dates, as the API's "today" is (Time:LocalTimeZone).
          today=$(TZ=Asia/Yangon date +%F)
          later=$(TZ=Asia/Yangon date -d '+30 days' +%F)
          body=$(curl -s "$api/api/v1/services")
          check "anonymous GET /api/v1/services is Auth.Unauthenticated" "Auth.Unauthenticated" "$(echo "$body" | jq -r .errorCode)"
          check "anonymous GET /api/v1/services is 401" 401 "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/v1/services")"
          # The F-003 route above was deactivated by its own checks; a service needs an active one.
          check "POST /api/v1/routes SMOKE2 is 201" 201 "$(send -X POST "$api/api/v1/routes" -H "Content-Type: application/json" \
            -d "{\"code\":\"SMOKE2\",\"nameEn\":\"Smoke route 2\",\"nameMy\":\"လမ်းကြောင်း\",\"isClosed\":false,\"stationIds\":[\"$sma\",\"$smb\"]}")"
          route2=$(jq -r .id "$reply")
          check "POST /api/v1/services SV1 is 201" 201 "$(send -X POST "$api/api/v1/services" -H "Content-Type: application/json" \
            -d "{\"code\":\"SV1\",\"nameEn\":\"Smoke service\",\"nameMy\":\"ရထား\",\"routeId\":\"$route2\",\"direction\":\"Forward\",\"stopStationIds\":[\"$sma\",\"$smb\"],\"operatingDays\":[\"Monday\"],\"effectiveFrom\":\"$today\"}")"
          service=$(jq -r .id "$reply")
          check "GET /api/v1/services/{id} is 200" 200 "$(send "$api/api/v1/services/$service")"
          check "the service reads back with two stops" 2 "$(jq '.stops | length' "$reply")"
          check "GET /api/v1/services is 200" 200 "$(send "$api/api/v1/services")"
          check "POST /api/v1/services/{id}/withdraw is 204" 204 "$(send -X POST "$api/api/v1/services/$service/withdraw" \
            -H "Content-Type: application/json" -d "{\"withdrawFrom\":\"$later\"}")"
          check "withdrawing it again from the same date is 422" 422 "$(send -X POST "$api/api/v1/services/$service/withdraw" \
            -H "Content-Type: application/json" -d "{\"withdrawFrom\":\"$later\"}")"
          check "and says Timetable.WithdrawalDoesNotShorten" "Timetable.WithdrawalDoesNotShorten" "$(jq -r .errorCode "$reply")"

          # F-005: timetable versions in the deployed shape, through the seeded schedules.* grants
          # (Identity_SeedSchedulePermissionGrants), the Security_TimetableScheduleGrants grants, the
          # Timetable-wide lock and the filtered unique index under ycr_app, with the same
          # administrator token. SV1 above runs from today until the day before $later.
          tomorrow=$(TZ=Asia/Yangon date -d '+1 day' +%F)
          body=$(curl -s "$api/api/v1/schedules/versions")
          check "anonymous GET /api/v1/schedules/versions is Auth.Unauthenticated" "Auth.Unauthenticated" "$(echo "$body" | jq -r .errorCode)"
          check "anonymous GET /api/v1/schedules/versions is 401" 401 "$(curl -s -o /dev/null -w '%{http_code}' "$api/api/v1/schedules/versions")"
          check "POST /api/v1/schedules/versions (today, SV1) is 201" 201 "$(send -X POST "$api/api/v1/schedules/versions" -H "Content-Type: application/json" \
            -d "{\"nameEn\":\"Smoke timetable\",\"nameMy\":\"အချိန်ဇယား\",\"effectiveFrom\":\"$today\",\"services\":[{\"serviceId\":\"$service\",\"stopTimes\":[{\"position\":1,\"departure\":\"06:00\"},{\"position\":2,\"arrival\":\"06:10\"}]}]}")"
          version=$(jq -r .id "$reply")
          check "GET /api/v1/schedules/versions/{id} is 200" 200 "$(send "$api/api/v1/schedules/versions/$version")"
          check "GET /api/v1/schedules/versions/{id}/services/{serviceId} is 200" 200 "$(send "$api/api/v1/schedules/versions/$version/services/$service")"
          check "the service's times read back as HH:mm" "06:00" "$(jq -r '.stops[0].departure' "$reply")"
          check "GET /api/v1/schedules/versions is 200" 200 "$(send "$api/api/v1/schedules/versions")"
          check "publishing it is 204" 204 "$(send -X POST "$api/api/v1/schedules/versions/$version/publish")"
          check "GET /api/v1/schedules/versions/in-force?date=today is 200" 200 "$(send "$api/api/v1/schedules/versions/in-force?date=$today")"
          check "and names it" "$version" "$(jq -r .id "$reply")"
          check "cancelling a version in force is 422" 422 "$(send -X POST "$api/api/v1/schedules/versions/$version/cancel")"
          check "and says Timetable.ScheduleVersionAlreadyEffective" "Timetable.ScheduleVersionAlreadyEffective" "$(jq -r .errorCode "$reply")"
          check "an empty version from today is 422" 422 "$(send -X POST "$api/api/v1/schedules/versions" -H "Content-Type: application/json" \
            -d "{\"nameEn\":\"Smoke suspension\",\"nameMy\":\"ရပ်ဆိုင်း\",\"effectiveFrom\":\"$today\",\"services\":[]}")"
          check "and says Timetable.EmptyScheduleVersionNotInFuture" "Timetable.EmptyScheduleVersionNotInFuture" "$(jq -r .errorCode "$reply")"
          check "an empty version from tomorrow is 201" 201 "$(send -X POST "$api/api/v1/schedules/versions" -H "Content-Type: application/json" \
            -d "{\"nameEn\":\"Smoke suspension\",\"nameMy\":\"ရပ်ဆိုင်း\",\"effectiveFrom\":\"$tomorrow\",\"services\":[]}")"
          suspension=$(jq -r .id "$reply")
          check "publishing it is 204" 204 "$(send -X POST "$api/api/v1/schedules/versions/$suspension/publish")"
          check "cancelling it before it takes effect is 204" 204 "$(send -X POST "$api/api/v1/schedules/versions/$suspension/cancel")"
          check "a draft for tomorrow is 201" 201 "$(send -X POST "$api/api/v1/schedules/versions" -H "Content-Type: application/json" \
            -d "{\"nameEn\":\"Smoke draft\",\"nameMy\":\"မူကြမ်း\",\"effectiveFrom\":\"$tomorrow\",\"services\":[]}")"
          check "discarding it is 204" 204 "$(send -X POST "$api/api/v1/schedules/versions/$(jq -r .id "$reply")/discard")"
          check "withdrawing SV1 while the published version lists it is 422" 422 "$(send -X POST "$api/api/v1/services/$service/withdraw" \
            -H "Content-Type: application/json" -d "{\"withdrawFrom\":\"$tomorrow\"}")"
          check "and says Timetable.ServiceInPublishedScheduleVersion" "Timetable.ServiceInPublishedScheduleVersion" "$(jq -r .errorCode "$reply")"

          # D10: a second bootstrap is refused (exit 1) and creates nothing.
          printf '%s\n' "$YCR_SMOKE_ADMIN_INITIAL_PASSWORD" | \
            DOTNET_ENVIRONMENT=Testing \
            ConnectionStrings__Application="Server=localhost,1433;Database=YCR;User Id=ycr_app;Password=${YCR_APP_PASSWORD};TrustServerCertificate=True;Current Language=us_english" \
            dotnet src/YCR.Worker/bin/Release/net10.0/YCR.Worker.dll bootstrap-administrator --username second.admin \
            && bootstrap=0 || bootstrap=$?
          check "a second bootstrap exits 1" "1" "$bootstrap"

          exit $fail

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-logs"
          cp "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/smoke-logs/api.log" 2>/dev/null || true
          docker compose logs --no-color > "$RUNNER_TEMP/smoke-logs/compose.log" 2>&1 || true

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          retention-days: 7
          if-no-files-found: warn

      - name: Stop the API
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/api.pid" ] && kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
          docker compose down -v || true

  trunk-only-tests:
    name: Trunk-only tests
    # On a pull request into main AND on push to main. Running them only after merge would mean
    # the first time anyone learns the ledger guard or the fragmentation control broke is when
    # main is already red.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YCR_DESIGN_TIME_CONNECTION: Server=localhost;Database=YcrDesignTime;Trusted_Connection=True;TrustServerCertificate=True

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore and build
        run: |
          dotnet tool restore
          dotnet restore YCR.sln
          dotnet build YCR.sln --no-restore --configuration Debug

      - name: Build the migration bundle once
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          dotnet ef migrations bundle --force \
            --project src/YCR.Infrastructure \
            --startup-project src/YCR.Infrastructure \
            --output "$RUNNER_TEMP/bundle/efbundle"
          echo "YCR_MIGRATION_BUNDLE=$RUNNER_TEMP/bundle/efbundle" >> "$GITHUB_ENV"

      # The exact complement of the default run: YCR_RUN_TRUNK_ONLY_TESTS lifts the exclusion in
      # tests/Directory.Build.props, and the trait filter selects only these. Between the two
      # jobs every test in the solution runs.
      # YCR_RUN_TRUNK_ONLY_TESTS is the whole switch: tests/Directory.Build.props swaps the
      # default "exclude TrunkOnly" filter for "only TrunkOnly", and adds the zero-tests waiver
      # every assembly without such a test needs. The filter is not repeated on this command
      # line — doing that also meant repeating the waiver, which collided with the copy
      # YCR.IntegrationTests carries in its own csproj and made that assembly exit 5 without
      # running. That is how this job failed the first time.
      - name: Run trunk-only tests
        env:
          YCR_RUN_TRUNK_ONLY_TESTS: '1'
        run: >
          dotnet test YCR.sln --no-build
          --
          --report-xunit-trx
          --results-directory "${{ runner.temp }}/test-results"

      - name: Assert trunk-only tests actually ran
        run: |
          set -euo pipefail
          executed=$(grep -ho 'executed="[0-9]*"' "$RUNNER_TEMP"/test-results/*.trx \
            | grep -o '[0-9]*' | awk '{sum += $1} END {print sum + 0}')
          echo "Trunk-only tests executed: $executed"
          if [ "$executed" -eq 0 ]; then
            echo "No trunk-only test ran. Either the trait was renamed or the filter is wrong;"
            echo "either way this job was about to pass while proving nothing."
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-trunk-only
          path: ${{ runner.temp }}/test-results
          retention-days: 7
          if-no-files-found: warn

      - name: Upload container logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/container-logs"
          for id in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$id" | tr -d '/')
            docker logs "$id" > "$RUNNER_TEMP/container-logs/$name.log" 2>&1 || true
          done
          docker ps -a > "$RUNNER_TEMP/container-logs/docker-ps.txt" 2>&1 || true

      - name: Upload container logs artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-logs-trunk-only
          path: ${{ runner.temp }}/container-logs
          retention-days: 7
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The one job that needs more than the workflow default, and only by one read scope.
    # On a pull_request event gitleaks-action enumerates the PR's commits via
    # GET /repos/{owner}/{repo}/pulls/{n}/commits, which `contents: read` does not cover; the
    # job failed with "Resource not accessible by integration" (403) until this was added.
    # Deliberately `read`: the action would also post PR comments, which needs write, and
    # GITLEAKS_ENABLE_COMMENTS below turns that off rather than granting it. A finding fails
    # the job, which is the signal that matters — a comment is a convenience.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks scans history, which needs the whole history rather than one commit.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments, so the job never needs write access. The job's own failure is the
          # signal, and a leaked secret should not be echoed into a comment anyway.
          GITLEAKS_ENABLE_COMMENTS: 'false'
